<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="100%" stop-color="#020d09" />
    </linearGradient>

    <!-- Emerald Stroke Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA8" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#00B875" />
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#00E599" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00E599" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1a3d2e" stroke-width="4"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)"/>

  <!-- Inner Subtle Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#00E599" stroke-opacity="0.12" stroke-width="2"/>

  <!-- WebNavi Signature Chevron Glyph -->
  <polyline points="96 352 197 160 256 275 315 160 416 352"
            stroke="url(#glyphGrad)"
            stroke-width="48"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#shadowFilter)" />
</svg>

