<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="100%" stop-color="#020e09" />
    </linearGradient>
    <linearGradient id="fullDarkGlyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA8" />
      <stop offset="100%" stop-color="#00D285" />
    </linearGradient>
    <filter id="fullDarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#00E599" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="940" height="260" rx="32" fill="url(#cardBg)" stroke="#1a3d2e" stroke-width="2.5"/>

  <!-- Icon Mark -->
  <g transform="translate(60, 40)">
    <polyline points="33 142 75 58 100 108 125 58 167 142"
              stroke="url(#fullDarkGlyph)"
              stroke-width="21.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#fullDarkGlow)" />
  </g>

  <!-- Typography: WebNavi -->
  <text x="280" y="165"
        fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="110"
        font-weight="800"
        letter-spacing="-2.5">WebNavi</text>

  <!-- Beacon Dot -->
  <circle cx="825" cy="150" r="13" fill="url(#fullDarkGlyph)" filter="url(#fullDarkGlow)"/>
</svg>

