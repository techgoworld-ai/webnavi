<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" fill="none">
  <defs>
    <linearGradient id="fullGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA8" />
      <stop offset="100%" stop-color="#00D285" />
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00E599" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Group: Icon Mark -->
  <g transform="translate(30, 20)">
    <!-- Glyph scaled to ~200x200 -->
    <polyline points="33 142 75 58 100 108 125 58 167 142"
              stroke="url(#fullGlyphGrad)"
              stroke-width="21.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#fullGlow)" />
  </g>

  <!-- Brand Typography: "WebNavi" -->
  <text x="245" y="146"
        fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="108"
        font-weight="800"
        letter-spacing="-2.5">WebNavi</text>

  <!-- Accent Dot / Domain Suffix Beacon -->
  <circle cx="780" cy="132" r="12" fill="url(#fullGlyphGrad)" filter="url(#fullGlow)"/>
</svg>

